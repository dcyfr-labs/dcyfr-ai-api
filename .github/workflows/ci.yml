name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true  # Allow migration to proceed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - run: npm install --include=dev
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true  # Allow migration to proceed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - run: npm install --include=dev
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true  # Allow migration to proceed
    strategy:
      matrix:
        node-version: ['24.22.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install --include=dev
      - run: npm run native:sqlite:ensure
      # test:coverage is test:run plus v8 coverage; test:run alone writes no
      # coverage/ directory, so the upload below had nothing to send.
      - run: npm run test:coverage
      - name: Upload coverage
        # First matrix leg only, so artifact names never collide. Keyed on the
        # index, not a version literal, so a Node bump cannot silently skip it.
        if: strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
